# Copy this file into the target repo as .github/workflows/qa.yml.
# It calls the reusable workflow hosted in Agentic-QE — see
# .github/workflows/qa-pipeline.yml in this repo for what it actually does.
#
# Two refs must point at the same Agentic-QE version:
#   - the `uses:` ref below  — which version of the reusable workflow runs
#   - `plugin_ref`           — which version of the skills/rules it loads
name: QA Pipeline
on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**', '.github/**']
  workflow_dispatch:

jobs:
  qa:
    uses: Cognify-Analytics/Agentic-QE/.github/workflows/qa-pipeline.yml@main
    secrets: inherit
    with:
      live: false
      plugin_ref: main
      # node_version: '20'   # only if the repo has a JS/TS stack
      # max_turns: 200       # ceiling that stops a runaway run; raise for large or
      #                      # multi-stack repos. Lowering it does NOT cut normal cost.
      # model: claude-sonnet-5
      #                      # pins the whole pipeline to one model. Check the run's
      #                      # telemetry (job summary / PR comment footer) before and
      #                      # after — cost here is usually bound by token volume,
      #                      # not model price. See README "Cost and telemetry".
      # fix_bugs: true       # opt-in, off by default: let /triage-tests attempt a
      #                      # verified fix to production source for a narrow set of
      #                      # documented bugs and open a second PR linked to the
      #                      # filed issue. Turn on branch protection with required
      #                      # human review FIRST — see README "Set it up in a
      #                      # target repo". Safe to try with live: false first —
      #                      # it will only report what it would fix.
      setup_script: |
        python -m pip install -U pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
