# Agentic QE: copy this file into your repo as .github/workflows/qa.yml
#
# Only one thing must be changed before the first run: STEP 1 below.
# Everything else works as it is.
#
# Updating an existing qa.yml? Keep your current setup_script.
# Full guide: README, "Run it as a GitHub Action".

name: QA Pipeline

# Runs when a pull request is opened, or a draft is marked ready for review.
# New commits on an open PR don't re-run it. To re-test, use
# Actions → QA Pipeline → Run workflow.
on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**', '.github/**']   # docs-only PRs are skipped
  workflow_dispatch:
    inputs:
      clickup_task_id:
        description: ClickUp task ID, e.g. CU-86bbh0u96. Only needed with clickup_branch_naming on, on a branch with no CU-id in its name.
        required: false
        type: string

jobs:
  qa:
    # The Agentic-QE version to use. Keep plugin_ref below the same.
    uses: Cognify-Analytics/Agentic-QE/.github/workflows/qa-pipeline.yml@main
    secrets: inherit
    with:
      # ── STEP 1 (required): how to install this repo ─────────────────────────
      # Replace these lines with the commands that install this repo's
      # dependencies, its test runner and its coverage plugin.
      setup_script: |
        python -m pip install -U pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

      # Other examples:
      #   Backend + frontend:  pip install -r backend/requirements-dev.txt
      #                        npm --prefix frontend ci
      #   Backend with uv:     pip install uv
      #                        uv sync --directory backend --frozen
      #   Node only:           npm ci

      # ── STEP 2: settings (the defaults are right for a first run) ───────────
      plugin_ref: main         # same version as the @main in `uses:` above
      live: false              # false = report only. Set to true later to file real issues and PRs
      # node_version: '22'     # uncomment if the repo has JavaScript or TypeScript

      # ── Optional: leave these commented out unless you need them ────────────
      # fix_bugs: true                 # also open PRs that fix real bugs (set up branch protection first)
      # clickup_branch_naming: true    # only if branch names must contain CU-<task id>
      # max_turns: 200                 # raise if runs on a large repo stop early
      # model: claude-sonnet-5-5       # pin a specific Claude model

      clickup_task_id: ${{ inputs.clickup_task_id }}   # leave as it is
