name: Agentic QE Pipeline

on:
  workflow_call:
    inputs:
      setup_script:
        description: Shell commands that install the target repo's dependencies (test framework included).
        required: true
        type: string
      live:
        description: Run /triage-tests in live mode (real branches/PRs/issues) instead of report-only.
        required: false
        type: boolean
        default: false
      fix_bugs:
        description: >-
          Opt-in, off by default. Let /triage-tests attempt an actual, narrowly-scoped
          fix to production source for a small subset of COMPLEX bugs (only those backed
          by a specific documented expectation — see rules/error-classification.md),
          verify it against the full suite, and open a second PR linked to the issue
          ("Relates to #N", never auto-closing it). Works independently of `live`:
          with `live: false` it only computes and reports what it would fix. Requires
          branch protection with required human review on the target branch before
          turning this on for real — see README "Set it up in a target repo".
        required: false
        type: boolean
        default: false
      clickup_branch_naming:
        description: >-
          Opt-in, off by default. For repos whose branch policy requires a ClickUp task
          ID. Every branch the pipeline pushes then carries the task ID of the branch
          that triggered the run: a run on bug/CU-101010-cache-loading pushes
          auto-fix/CU-101010-triage-<sha>, auto-fix/CU-101010-bugfix-issue-<n> and
          auto-fix/CU-101010-qa-baseline-<sha>. If no task ID can be found, the run
          pushes no branch at all (issues are still filed). See scripts/branch_names.py.
        required: false
        type: boolean
        default: false
      clickup_task_id:
        description: >-
          Only used with clickup_branch_naming, and only when the triggering branch has
          no CU-<id> in its name (typically a workflow_dispatch on the default branch).
          With or without the "CU-" prefix.
        required: false
        type: string
        default: ''
      plugin_ref:
        description: Agentic-QE tag/ref to pin the plugin checkout to.
        required: false
        type: string
        default: main
      node_version:
        description: Node version to set up. Leave empty for repos with no JS/TS stack.
        required: false
        type: string
        default: ''
      python_version:
        description: >-
          Python version to set up. Python is always set up (the pipeline's own scripts need
          3.9 or newer); change it only if the target repo needs a different one.
        required: false
        type: string
        default: '3.12'
      java_version:
        description: >-
          JDK version to set up (Temurin), e.g. '21'. Leave empty for repos with no Java/Kotlin
          stack. Match what the build targets (maven-compiler-plugin release, Gradle toolchain).
        required: false
        type: string
        default: ''
      reminder_days:
        description: >-
          Days without a maintainer reply before the pipeline comments that an open issue it
          filed still needs attention (at most once per this many days, three times per issue).
          0 turns reminders off.
        required: false
        type: number
        default: 7
      max_turns:
        description: >-
          Turn budget for the Claude run. This is a ceiling that stops a runaway run, not
          a target — lowering it does not make a normal run cheaper. Raise for large or
          multi-stack repos.
        required: false
        type: number
        default: 150
      model:
        description: >-
          Model to run the pipeline on: any --model value (opus, sonnet, claude-opus-5-5, ...).
          Defaults to opus, the model that writes the deepest tests and the one a local
          run normally uses, so CI and local runs match. sonnet costs less but writes
          noticeably shallower tests — see README "Cost and telemetry".
        required: false
        type: string
        default: opus
      effort:
        description: >-
          Reasoning effort for the whole run, stages included: low, medium, high, xhigh
          or max. Defaults to high, the effort a local session normally runs at. Lower it
          to trade test depth for cost.
        required: false
        type: string
        default: high
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      AGENTIC_QE_READ_TOKEN:
        description: Token with read access to Cognify-Analytics/Agentic-QE, only needed while that repo is private.
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # One run per PR, per followed-up issue, or per ref. Comment-triggered runs never
  # cancel a PR run, and a second comment on the same issue supersedes the first.
  group: qa-pipeline-${{ github.event.pull_request.number || (github.event.issue.number && format('issue-{0}', github.event.issue.number)) || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    # A bootstrap run that tests every route of a multi-stack repo takes half an
    # hour or more at the default model and effort. A timeout throws away
    # everything the run wrote, so leave room.
    timeout-minutes: 90
    # issue_comment: only a maintainer's comment on an issue this pipeline filed (not a
    # PR comment, not a bot). Everyone else's comments never start a run -- on a public
    # repo, a comment must not be able to make the pipeline change code. The pipeline's
    # own comments use GITHUB_TOKEN, which never triggers workflows, so there is no loop.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'qa:skip')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'agentic-qe') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       github.event.comment.user.type != 'Bot') ||
      (github.event_name != 'pull_request' && github.event_name != 'issue_comment')
    steps:
      - name: Check out the target repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out the Agentic QE plugin
        uses: actions/checkout@v5
        with:
          repository: Cognify-Analytics/Agentic-QE
          ref: ${{ inputs.plugin_ref }}
          path: .agentic-qe
          token: ${{ secrets.AGENTIC_QE_READ_TOKEN || github.token }}

      # The reusable workflow and the skills it drives are two separate checkouts at
      # two separately-specified refs. Pinning them apart is silently destructive —
      # a new workflow driving old skills produces behaviour neither version was
      # tested with — so name it loudly rather than letting it look like a normal run.
      - name: Check the plugin matches this workflow
        env:
          WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          set -uo pipefail
          PLUGIN_SHA=$(git -C .agentic-qe rev-parse HEAD 2>/dev/null || echo unknown)
          echo "plugin   (${{ inputs.plugin_ref }}): ${PLUGIN_SHA}"
          echo "workflow                           : ${WORKFLOW_SHA:-unknown}"
          if [ -n "${WORKFLOW_SHA:-}" ] && [ "${PLUGIN_SHA}" != "unknown" ] \
             && [ "${PLUGIN_SHA}" != "${WORKFLOW_SHA}" ]; then
            echo "::warning::plugin_ref '${{ inputs.plugin_ref }}' (${PLUGIN_SHA}) is not the same commit as the reusable workflow (${WORKFLOW_SHA}). The workflow and the skills it drives are from different versions — set plugin_ref to the same ref you call the workflow at."
          fi

      - name: Keep scratch out of the diff
        run: printf '%s\n' '.claude-pipeline/' '.agentic-qe/' >> .git/info/exclude

      # Always set up Python: scripts/parse_coverage.py and scripts/resolve_owners.py
      # need it even when the target repo has no Python stack of its own.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - uses: actions/setup-node@v5
        if: inputs.node_version != ''
        with:
          node-version: ${{ inputs.node_version }}
          # v5 turns on dependency caching by itself when package.json names a
          # packageManager. Keep v4's behaviour: setup_script owns installs.
          package-manager-cache: false

      # No cache: input on purpose, same reason as above -- setup_script owns installs.
      - uses: actions/setup-java@v5
        if: inputs.java_version != ''
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Install target repo dependencies
        run: ${{ inputs.setup_script }}

      - name: Configure git identity
        run: |
          git config user.name  'agentic-qe[bot]'
          git config user.email 'agentic-qe[bot]@users.noreply.github.com'

      - name: Decide strategy and write run.json
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          # Via env, never inlined into the script: a branch name is user-controlled text.
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          CLICKUP: ${{ inputs.clickup_branch_naming }}
          CLICKUP_TASK_ID: ${{ inputs.clickup_task_id }}
          EVENT: ${{ github.event_name }}
          FOLLOWUP_ISSUE: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p .claude-pipeline
          SHA=$(git rev-parse --short HEAD)

          # Every branch name the pipeline will push, decided once, here, by the same
          # script a local run uses — the skills read them from run.json.
          CLICKUP_FLAG=()
          [ "$CLICKUP" = true ] && CLICKUP_FLAG=(--clickup)
          BRANCH_NAMING=$(python .agentic-qe/scripts/branch_names.py \
            --branch "$HEAD_BRANCH" --sha "$SHA" --task-id "$CLICKUP_TASK_ID" "${CLICKUP_FLAG[@]}")
          NAMING_PROBLEM=$(jq -r '.problem // empty' <<<"$BRANCH_NAMING")
          if [ -n "$NAMING_PROBLEM" ]; then
            echo "::warning title=Agentic QE branch naming::${NAMING_PROBLEM}. Issues are still filed; fix PRs are only reported."
          fi

          # A usable .qa/ baseline is what makes an incremental run possible at all.
          HAVE_BASELINE=false
          if [ -f .qa/test-inventory.json ] && [ -f .qa/context.md ] \
             && jq -e '.modules' .qa/test-inventory.json >/dev/null 2>&1; then
            HAVE_BASELINE=true
          fi

          # One diff, reused by both decisions below. Empty on workflow_dispatch,
          # where there is no base to diff against.
          CHANGED=''
          if [ -n "${BASE:-}" ]; then
            git fetch --no-tags origin "$BASE"
            CHANGED=$(git diff --name-only --diff-filter=d "origin/$BASE...HEAD" || true)
          fi

          # --- Strategy: what should /generate-tests do? ---
          # A maintainer's reply on a pipeline issue only needs that issue followed up.
          TARGETS='[]'
          if [ "$EVENT" = issue_comment ]; then
            STRATEGY=follow-up-only
          elif [ "$HAVE_BASELINE" = false ]; then
            STRATEGY=bootstrap
          else
            # Source files only: not tests (by folder, Gradle test source set or file
            # name), not type declarations, stories or tool config files.
            SRC=$(printf '%s\n' "$CHANGED" \
              | grep -Ev '(^|/)(tests?|spec|__tests__|__mocks__|test-utils)/' \
              | grep -Ev '(^|/)src/(testFixtures|[a-z][A-Za-z]*Test)/' \
              | grep -Ev '(\.(test|spec|stories)\.[cm]?[jt]sx?|\.d\.[cm]?ts|(Test|Tests|IT|Spec)\.(java|kt)|_test\.(py|go)|(^|/)test_[^/]*\.py|(^|/)conftest\.py|\.config\.[cm]?[jt]s)$' \
              | grep -E '\.(py|js|jsx|mjs|cjs|ts|tsx|mts|cts|java|kt|go|rb|cs|rs|php)$' || true)
            if [ -z "$SRC" ]; then
              STRATEGY=triage-only
            else
              STRATEGY=incremental
              TARGETS=$(printf '%s\n' "$SRC" | jq -R . | jq -sc .)
            fi
          fi

          # --- Can Stage 2 (/build-context) be skipped entirely? ---
          # Sections 1-3 of context.md are derived only from docs, manifests and schema
          # files, and the repo-tuned workflow template only from manifests, runtime
          # version files and the repo's own CI. If none of those changed, neither
          # output can have changed, so regenerating them just to diff them is pure spend. Section 4 (coverage)
          # is handled by the orchestrator, which also requires that Stage 1 left the
          # inventory alone before it acts on this flag.
          # Deliberately conservative: unless we have a real base diff proving nothing
          # relevant changed, this stays true and Stage 2 runs as before.
          CTX_INPUTS_CHANGED=true
          if [ "$HAVE_BASELINE" = true ] && [ -n "${BASE:-}" ]; then
            CTX_HITS=$(printf '%s\n' "$CHANGED" | grep -Ei \
              -e '(^|/)readme' \
              -e '(^|/)docs?/' \
              -e '\.(md|rst|sql|prisma|proto|graphql)$' \
              -e '(^|/)(migrations?|models?|schemas?|entit(y|ies)|domain)/' \
              -e '(^|/)(pyproject\.toml|setup\.cfg|package\.json|requirements[^/]*\.txt|pom\.xml|build\.gradle[^/]*|settings\.gradle[^/]*|libs\.versions\.toml|go\.mod|Cargo\.toml|[^/]+\.csproj)$' \
              -e '(^|/)(application[^/]*\.(ya?ml|properties)|\.env\.example)$' \
              -e '(^|/)(\.nvmrc|\.node-version|\.python-version|\.java-version|\.tool-versions|\.sdkmanrc|pnpm-workspace\.yaml|\.yarnrc\.yml)$' \
              -e '^\.github/workflows/' \
              || true)
            [ -z "$CTX_HITS" ] && CTX_INPUTS_CHANGED=false
          fi

          jq -n \
            --arg sha "$SHA" \
            --arg branch "$HEAD_BRANCH" \
            --arg ts "$(date -u +%FT%TZ)" \
            --arg strategy "$STRATEGY" \
            --argjson targets "$TARGETS" \
            --argjson pr "${{ github.event.pull_request.number || 'null' }}" \
            --argjson live "${{ inputs.live && 'true' || 'false' }}" \
            --argjson fix_bugs "${{ inputs.fix_bugs && 'true' || 'false' }}" \
            --argjson ctx_changed "$CTX_INPUTS_CHANGED" \
            --argjson branch_naming "$BRANCH_NAMING" \
            --argjson followup_issue "${FOLLOWUP_ISSUE:-null}" \
            --argjson reminder_days "${{ inputs.reminder_days }}" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '
            { sha:$sha, branch:$branch, timestamp:$ts, mode:"ci", live:$live, fix_bugs:$fix_bugs,
              branch_naming:$branch_naming,
              followup: { reminder_days:$reminder_days },
              ci: { pr_number:$pr, pr_base_branch:$branch, default_branch:$default_branch,
                    run_url:$run_url, strategy:$strategy, targets:$targets,
                    context_inputs_changed:$ctx_changed, followup_issue:$followup_issue } }' > .claude-pipeline/run.json

          cat .claude-pipeline/run.json

      # Remember what was already changed before the model starts, so the safety
      # check below only judges what the pipeline itself did — a setup_script that
      # rewrites a lock file is not the pipeline's doing. Kept in RUNNER_TEMP,
      # outside the repo, where the run cannot touch it.
      - name: Snapshot the working tree
        run: python .agentic-qe/scripts/check_test_only_changes.py --snapshot "$RUNNER_TEMP/agentic-qe-tree-before.json"

      - name: Run the QA pipeline
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: '/agentic-qe:test-pipeline'
          track_progress: false
          settings: |
            { "env": { "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}",
                       "GH_REPO":  "${{ github.repository }}" } }
          claude_args: |
            --model ${{ inputs.model || 'opus' }}
            --effort ${{ inputs.effort || 'high' }}
            --plugin-dir ./.agentic-qe
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      # Cost/turn telemetry. Deliberately never fails the job — a missing or
      # reshaped execution log costs us a data point, not a run.
      # Built by scripts/collect_telemetry.py, the same script a local run uses
      # (scripts/run_local.py, or /test-pipeline's own Finish step), so a CI run and
      # a local run produce the same telemetry.json and the same summary block.
      - name: Collect telemetry
        id: telemetry
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -uo pipefail
          # This step runs on always(), so it can be reached even if the plan step
          # (which normally creates this) never got there.
          mkdir -p .claude-pipeline
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            cp "$EXEC_FILE" .claude-pipeline/execution-log.json 2>/dev/null || true
          fi

          # The plugin checkout itself failed: there is no script to run. Say the
          # pipeline didn't run rather than reporting a run that "cost nothing".
          if [ ! -f .agentic-qe/scripts/collect_telemetry.py ]; then
            echo '{"schema_version":1,"source":"ci","conclusion":"did-not-run"}' > .claude-pipeline/telemetry.json
            echo "### Agentic QE" >> "$GITHUB_STEP_SUMMARY" || true
            echo "The pipeline did not run: the Agentic QE plugin could not be checked out. See the job log." >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi

          # An empty or "skipped" outcome means an earlier step failed (dependency
          # setup is the usual one); the script then records did-not-run.
          python .agentic-qe/scripts/collect_telemetry.py \
            --execution-file "${EXEC_FILE:-}" \
            --source ci \
            --outcome "${CLAUDE_OUTCOME}" \
            --pipeline-dir .claude-pipeline \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --model "${{ inputs.model || 'opus' }}" \
            --effort "${{ inputs.effort || 'high' }}" \
            --max-turns "${{ inputs.max_turns }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT" \
            --github || true
          exit 0

      # The readable half of the execution log: what the agent did stage by stage,
      # what it skipped and why, and where it got blocked. The full version goes in
      # the run artifact as trace.md. Like telemetry, this never fails the job.
      - name: Summarize what the agent did
        if: always() && steps.claude.outcome != '' && steps.claude.outcome != 'skipped'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "The Claude step left no execution log, so there is no timeline to show."
            exit 0
          fi
          python .agentic-qe/scripts/render_trace.py "$EXEC_FILE" \
            --pipeline-dir .claude-pipeline \
            --summary "$GITHUB_STEP_SUMMARY" \
            --out .claude-pipeline/trace.md || true

      # The run's durable record in .qa/runs/. .claude-pipeline/ is scratch and
      # leaves with the runner; this is what a teammate reads about the run later:
      # where and on what it ran, what it found and why, what it filed, and the runs
      # before it. Built after telemetry, by the same script a local run uses, so
      # local and CI records match.
      - name: Write the run record
        if: always() && steps.claude.outcome != '' && steps.claude.outcome != 'skipped'
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          python .agentic-qe/scripts/record_run.py --pipeline-dir .claude-pipeline --qa-dir .qa \
            --actor "$ACTOR" --event "$EVENT" --repo "$REPO" --repo-id "$REPO_ID" \
            --visibility "$VISIBILITY" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --workflow-sha "$WORKFLOW_SHA" || true

      - name: Assert no production source was changed
        id: assert
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail

          # If the pipeline never ran, this check would pass on an untouched tree and
          # look like a clean bill of health. Say plainly that it was not exercised —
          # a vacuous pass on the one safety-critical assertion is worth naming.
          if [ -z "${CLAUDE_OUTCOME}" ] || [ "${CLAUDE_OUTCOME}" = "skipped" ]; then
            echo "Pipeline did not run — nothing to assert (this check was not exercised)."
            exit 0
          fi
          # Tests are recognised by path convention, not by 01-tests.json's
          # test_location: that field is free text ("frontend/src/ (co-located
          # *.test.ts)"), and no directory prefix can tell a co-located test from
          # the production file next to it. Coverage reports and caches the test
          # run leaves behind are reported and ignored. See the script's docstring.
          python .agentic-qe/scripts/check_test_only_changes.py \
            --baseline "$RUNNER_TEMP/agentic-qe-tree-before.json" --github

      # Persist what the run produced: the pipeline's own bookkeeping in .qa/, and
      # the tests it generated.
      #
      # This is deliberately a workflow step rather than a model instruction. It runs
      # after every stage has finished and after "Write the run record", so the run's
      # record in .qa/runs/ is actually on disk by the time anything commits it.
      # /triage-tests used to be asked to commit .qa/ from Stage 3, before the record
      # existed, which is why CI runs recorded nothing.
      #
      # Where it goes:
      #   - The run record (.qa/runs/) always goes straight onto a non-default head
      #     branch, so the history of what each run found and filed survives even if
      #     its tests PR is never merged.
      #   - Generated tests that no auto-fix PR already carries leave together with
      #     the rest of .qa/ (inventory, context), on the pipeline's own branch, in a
      #     PR into the branch the run was on (a draft in report-only mode). Together,
      #     so the inventory never names a test file the branch doesn't have. Through
      #     a PR, because tests are code a person reviews. Before this, a run with no
      #     SIMPLE fixes threw its tests away and still committed an inventory that
      #     described them.
      #   - No generated tests: .qa/ alone, committed onto the head branch, or pushed
      #     with a PR when the run was on the default branch.
      #
      # Runs in report-only mode too: report-only is about not filing issues and not
      # touching the developer's code, not about throwing away the pipeline's own
      # output.
      - name: Record the run and keep the generated tests
        if: always() && steps.assert.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          START_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIVE: ${{ inputs.live }}
        run: |
          set -uo pipefail

          # The assert step above exits 0 when the pipeline never ran, so this step's
          # gate would still let it through. There is nothing to record in that case.
          if [ -z "${CLAUDE_OUTCOME}" ] || [ "${CLAUDE_OUTCOME}" = "skipped" ]; then
            echo "Pipeline did not run — nothing to record."
            exit 0
          fi

          # Where things went: in the job log, the job summary, and at the end of
          # summary.md, whose last section is the pipeline's "## Recorded" and which
          # the next step posts as the PR comment.
          note() {
            echo "$1"
            printf '%s\n\n' "$1" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            if [ -f .claude-pipeline/summary.md ]; then
              printf '\n%s\n' "$1" >> .claude-pipeline/summary.md
            fi
          }

          # /triage-tests checks out its own auto-fix/... branches and, in CI, never
          # switches back. Committing here would stack the record on top of those fix
          # commits, and the push below would then carry them straight onto the
          # developer's branch, skipping the fix PR. Go back to the commit the run
          # started from first. Uncommitted work (.qa/, and generated tests no
          # auto-fix branch took) comes along unchanged; a test file an auto-fix
          # branch did take leaves the tree here and travels in that PR.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "${START_SHA}^{commit}")" ]; then
            echo "Run ended on $(git rev-parse --abbrev-ref HEAD); returning to ${START_SHA} before recording."
            if ! git checkout -q --detach "${START_SHA}"; then
              echo "::warning::Could not return to ${START_SHA} to record the run — .qa/ and the generated tests are in the run artifact only."
              exit 0
            fi
          fi

          # The generated tests still in the working tree. Same rules as the safety
          # check, so only real test files qualify, and anything already changed
          # before the run started (by setup_script) is left out.
          TESTS="$RUNNER_TEMP/agentic-qe-tests.txt"
          python .agentic-qe/scripts/check_test_only_changes.py \
            --baseline "$RUNNER_TEMP/agentic-qe-tree-before.json" --list-tests > "$TESTS" || : > "$TESTS"
          TEST_COUNT=$(grep -c . "$TESTS" || true)

          # A copy in the run artifact whatever happens below, so a failed push or a
          # branch-naming problem never loses them.
          while IFS= read -r f; do
            f="${f%$'\r'}"
            [ -f "$f" ] || continue
            mkdir -p ".claude-pipeline/generated-tests/$(dirname "$f")"
            cp "$f" ".claude-pipeline/generated-tests/$f"
          done < "$TESTS"

          git add -- .qa/ 2>/dev/null || true
          if git status --porcelain --ignored=matching -- .qa/ 2>/dev/null | grep -q '^!!'; then
            echo "::warning::.qa/ has content but is git-ignored in this repo, so the pipeline's record cannot be committed. Remove the .qa entry from .gitignore."
          fi
          # Never .qa/ without the tests it describes: if they can't be staged,
          # nothing is committed and both stay in the artifact.
          if [ "$TEST_COUNT" -gt 0 ] && ! git --literal-pathspecs add --pathspec-from-file="$TESTS"; then
            echo "::warning::Could not stage the generated tests, so nothing was committed. The tests and .qa/ are in the run artifact."
            note "Nothing was committed: the generated tests could not be staged. They are in the run artifact, under \`generated-tests/\`, and \`.qa/\` beside them."
            exit 0
          fi
          if git diff --cached --quiet 2>/dev/null; then
            echo "No .qa/ changes and no generated tests to record."
            exit 0
          fi

          SHA=$(git rev-parse --short HEAD)
          ON_HEAD=false
          if [ -n "${HEAD_BRANCH}" ] && [ "${HEAD_BRANCH}" != "${DEFAULT_BRANCH}" ]; then ON_HEAD=true; fi

          # Commit straight onto the head branch, so the record travels with the
          # developer's PR and reaches the default branch when they merge it. If
          # someone pushed meanwhile, rebase onto them and retry, never force. A
          # GITHUB_TOKEN push does not re-trigger workflows, so no loop.
          push_to_head() {
            for attempt in 1 2 3; do
              if git push -q origin "HEAD:refs/heads/${HEAD_BRANCH}"; then return 0; fi
              echo "Push rejected (attempt ${attempt}) — the branch moved during the run; rebasing."
              git fetch --no-tags origin "${HEAD_BRANCH}" || true
              git rebase --autostash "origin/${HEAD_BRANCH}" || git rebase --abort 2>/dev/null || true
              sleep 3
            done
            return 1
          }

          # No generated tests, on a non-default branch: all of .qa/ goes onto it.
          if [ "$TEST_COUNT" -eq 0 ] && [ "$ON_HEAD" = true ]; then
            git commit -q \
              -m "chore(qa): record Agentic QE run ${SHA} [skip ci]" \
              -m "Only .qa/ is touched — no production source, no tests. Run: ${RUN_URL}"
            if push_to_head; then
              note "Recorded \`.qa/\` on \`${HEAD_BRANCH}\`, including the run record in \`.qa/runs/\`. No generated tests to keep."
            else
              echo "::warning::Could not record .qa/ on ${HEAD_BRANCH} after 3 attempts — the record is in the run artifact only."
            fi
            exit 0
          fi

          # Generated tests, on a non-default branch: the run's record in .qa/runs/
          # goes onto the branch now, and the tests (with the inventory and context
          # that describe them) go into a PR built on top of it. The record is only
          # ever added, never describes files the branch lacks, and must survive a
          # tests PR that is closed without merging: it is the history of what the
          # run found and filed.
          if [ "$ON_HEAD" = true ] && ! git diff --cached --quiet -- .qa/runs/ 2>/dev/null; then
            git commit -q --only \
              -m "chore(qa): record Agentic QE run ${SHA} [skip ci]" \
              -m "Only .qa/runs/ — the run's record. Its generated tests are in a separate PR. Run: ${RUN_URL}" \
              -- .qa/runs/
            if push_to_head; then
              note "Recorded the run in \`.qa/runs/\` on \`${HEAD_BRANCH}\`."
            else
              echo "::warning::Could not push the run record to ${HEAD_BRANCH}; it travels in the tests PR instead."
            fi
            # A rebase's autostash can leave the rest unstaged: stage it again.
            git add -- .qa/ 2>/dev/null || true
            git --literal-pathspecs add --pathspec-from-file="$TESTS" 2>/dev/null || true
          fi

          # Everything else goes on the pipeline's own branch, with a PR: generated
          # tests (and the .qa/ that describes them) into the branch the run was on,
          # or a .qa/-only baseline into the default branch. The pipeline never
          # pushes to a default branch (PRD Section 9, Rule 5).
          BASE="${HEAD_BRANCH:-${DEFAULT_BRANCH}}"

          # Named by scripts/branch_names.py in the plan step. Null means ClickUp
          # naming is on but there was no task ID: a branch outside the naming
          # policy is worse than no branch, so keep everything in the artifact only.
          QA_BRANCH=$(jq -r '.branch_naming.branches.qa_baseline // empty' .claude-pipeline/run.json 2>/dev/null || true)
          if [ -z "${QA_BRANCH}" ]; then
            if [ "$(jq -r '.branch_naming.clickup // false' .claude-pipeline/run.json 2>/dev/null)" = true ]; then
              echo "::warning::ClickUp branch naming is on but no task ID was found, so nothing was pushed. Re-run with the clickup_task_id input set."
              note "Nothing was pushed: ClickUp branch naming is on and no task ID was found. The generated tests are in the run artifact, under \`generated-tests/\`, and \`.qa/\` beside them."
              exit 0
            fi
            QA_BRANCH="agentic-qe/qa-baseline-${SHA}"
          fi
          # A re-run at the same commit gets its own branch and PR; the earlier
          # one is left exactly as it is.
          if git ls-remote --exit-code --heads origin "${QA_BRANCH}" >/dev/null 2>&1; then
            QA_BRANCH="${QA_BRANCH}-${GITHUB_RUN_ID}"
          fi

          BODY="$RUNNER_TEMP/agentic-qe-pr-body.md"
          DRAFT=()
          if [ "$TEST_COUNT" -gt 0 ]; then
            # No [skip ci]: these are tests, and the repo's own CI should run them.
            git commit -q \
              -m "test(qa): add tests generated by Agentic QE run ${SHA}" \
              -m "${TEST_COUNT} test file(s) and the .qa/ record that describes them. No production source. Run: ${RUN_URL}"
            REPORT_ONLY=()
            if [ "${LIVE}" != true ]; then
              REPORT_ONLY=(--report-only)
              DRAFT=(--draft)
            fi
            TITLE=$(python .agentic-qe/scripts/render_tests_pr.py --files "$TESTS" --sha "$SHA" \
              --pipeline-dir .claude-pipeline --run-url "$RUN_URL" "${REPORT_ONLY[@]}" --out "$BODY")
            if [ ! -s "$BODY" ]; then
              printf 'Tests generated by the Agentic QE pipeline at `%s`, and the `.qa/` record that describes them.\n\n[Run log](%s)\n' "$SHA" "$RUN_URL" > "$BODY"
            fi
          else
            git commit -q \
              -m "chore(qa): record Agentic QE run ${SHA} [skip ci]" \
              -m "Only .qa/ is touched — no production source, no tests. Run: ${RUN_URL}"
            TITLE="Agentic QE: record run ${SHA}"
            cat > "$BODY" <<EOF
          Adds the Agentic QE baseline and run record for \`${SHA}\`. Only \`.qa/\` is
          touched — no production source, no tests.

          Merging this is what lets the next run go incremental instead of
          bootstrapping the whole repo from scratch.

          [Run log](${RUN_URL})
          EOF
          fi

          if ! git push -q origin "HEAD:refs/heads/${QA_BRANCH}"; then
            echo "::warning::Could not push ${QA_BRANCH}. The generated tests and .qa/ are in the run artifact only."
            note "Could not push \`${QA_BRANCH}\`. The generated tests are in the run artifact, under \`generated-tests/\`, and \`.qa/\` beside them."
            exit 0
          fi
          if ! PR_URL=$(gh pr create --base "${BASE}" --head "${QA_BRANCH}" --title "${TITLE}" \
                          --body-file "$BODY" "${DRAFT[@]}" 2>"$RUNNER_TEMP/gh-pr-error.txt"); then
            echo "::warning::Pushed ${QA_BRANCH}, but could not open its PR: $(head -c 300 "$RUNNER_TEMP/gh-pr-error.txt")"
            PR_URL=""
          fi

          if [ "$TEST_COUNT" -gt 0 ]; then
            WHERE="${PR_URL:-branch \`${QA_BRANCH}\` (no PR could be opened)}"
            AS_DRAFT=""
            [ "${LIVE}" = true ] || AS_DRAFT=", as a draft because this run was report-only"
            note "**Generated tests kept:** ${TEST_COUNT} test file(s) and the \`.qa/\` record that describes them are in ${WHERE}, into \`${BASE}\`${AS_DRAFT}. Merge it to keep them."
            echo "::notice title=Agentic QE generated tests::${TEST_COUNT} test file(s) in ${PR_URL:-${QA_BRANCH}}"
          else
            note "Recorded \`.qa/\` on \`${QA_BRANCH}\` (${PR_URL:-no PR could be opened}): the pipeline never pushes to the default branch."
          fi
          exit 0

      - name: Post summary comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          COST=$(jq -r '.cost_usd  // "n/a"' .claude-pipeline/telemetry.json 2>/dev/null || echo 'n/a')
          TURNS=$(jq -r '.num_turns // "n/a"' .claude-pipeline/telemetry.json 2>/dev/null || echo 'n/a')
          STRAT=$(jq -r '.strategy  // "n/a"' .claude-pipeline/telemetry.json 2>/dev/null || echo 'n/a')
          { echo '<!-- agentic-qe-summary -->'
            cat .claude-pipeline/summary.md 2>/dev/null || echo 'QA pipeline did not complete — see the run log.'
            echo
            echo "_\$$COST · $TURNS turns · strategy \`$STRAT\` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } > body.md
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
               --jq '.[] | select(.body | contains("agentic-qe-summary")) | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@body.md
          else
            gh pr comment "$PR" --body-file body.md
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qa-pipeline-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .claude-pipeline/
            .qa/
          retention-days: 14

      # Telemetry outlives the scratch artifact on purpose: cost trends only become
      # readable across dozens of runs, which is well past 14 days. The trace rides
      # along, because the committed run record in .qa/runs/ points readers here
      # for the step-by-step detail.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qa-telemetry-${{ github.run_id }}
          path: |
            .claude-pipeline/telemetry.json
            .claude-pipeline/trace.md
          retention-days: 90
